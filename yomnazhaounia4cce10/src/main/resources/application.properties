spring.application.name=yomnazhaounia4cce10
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
server.port=8081
# Préfixe commun de l'API : Swagger UI => /api/swagger-ui.html, OpenAPI => /api/v3/api-docs
server.servlet.context-path=/api
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session ouverte pendant la sérialisation JSON (associations LAZY)
spring.jpa.open-in-view=true
# Palliatif provisoire (proxy LAZY) : disparaîtra avec les DTO (chapitre 10)
spring.jackson.serialization.fail-on-empty-beans=false
